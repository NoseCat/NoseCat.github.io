<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage AI Characters">
    <title>Characters - AI Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="accessibility.css">
</head>

<body>
    <button id="accessibility-toggle" class="accessibility-toggle">Accessible Mode</button>

    <div class="container">
        <header class="page-header">
            <nav class="main-nav" aria-label="Main navigation">
                <div class="logo">AI Chat</div>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="chat.html">Chat</a>
                    <a href="characters.html">Characters</a>
                    <a href="login.html">Login</a>
                    <a href="register.html">Register</a>
                </div>
                <button class="mobile-nav-toggle" id="mobile-menu-btn">☰</button>
            </nav>
        </header>

        <main class="main-content">
            <h1>AI Character Library</h1>

            <!-- Поиск по персонажам -->
            <div class="characters-search">
                <input type="text" id="character-search-input"
                    placeholder="Search characters by name or description...">
                <button id="search-characters" class="btn secondary">Search</button>
                <button id="reset-search" class="btn tertiary">Reset</button>
            </div>

            <div class="characters-controls">
                <button id="create-character" class="btn primary">Create New Character</button>
            </div>

            <section class="characters-grid" aria-label="Character library">
                <!-- Персонажи будут загружены здесь -->
            </section>
        </main>

        <footer class="page-footer">
            <p>&copy; 2025 AI Chat. No rights reserved.</p>
        </footer>
    </div>

    <!-- Character Editor Modal -->
    <div id="character-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title">Edit Character</h2>
            <form id="character-form">
                <input type="hidden" id="character-id">

                <div class="form-group">
                    <label for="character-name">Character Name</label>
                    <input type="text" id="character-name" placeholder="Enter character name" required>
                </div>

                <div class="form-group">
                    <label for="character-role">Role/Personality</label>
                    <input type="text" id="character-role" placeholder="e.g., Scientist, Philosopher" required>
                </div>

                <div class="form-group">
                    <label for="character-desc">Description</label>
                    <textarea id="character-desc" rows="2" placeholder="Brief description of this character"></textarea>
                </div>

                <div class="form-group">
                    <label for="character-prompt">System Prompt</label>
                    <textarea id="character-prompt" rows="6"
                        placeholder="Enter the system prompt that defines this character's behavior"
                        required></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="character-is-public">
                        Make character public (visible to all users)
                    </label>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn primary">Save Character</button>
                    <button type="button" id="close-modal" class="btn secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <script src="common.js"></script>
    <script src="characters.js"></script>
</body>

</html>
