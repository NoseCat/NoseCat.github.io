<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat with AI Assistant">
    <title>Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <nav class="main-nav" aria-label="Main navigation">
                <div class="logo">AI Chat Assistant</div>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="chat.html" class="active">Chat</a>
                    <a href="login.html">Login</a>
                    <a href="register.html">Register</a>
                </div>
            </nav>
        </header>

        <main class="main-content">
            <h1>Chat with AI</h1>
            
            <section class="chat-section" aria-label="Chat interface">
                <div class="chat-controls">
                    <button id="clear-chat" class="btn secondary">Clear Chat</button>
                    <button id="save-chat" class="btn secondary">Save Chat</button>
                </div>
                
                <div class="chat-container">
                    <div id="chat-messages" class="chat-messages" role="log" aria-live="polite">
                        <div class="message bot-message">
                            <strong>AI:</strong> Hello! I'm an AI assistant. How can I help you today?
                        </div>
                    </div>
                    
                    <div class="chat-input">
                        <input type="text" id="message-input" placeholder="Type your message here..." aria-label="Type your message">
                        <button id="send-btn" class="btn primary">Send</button>
                    </div>
                </div>
            </section>
        </main>

        <footer class="page-footer">
            <p>&copy; 2025 AI Chat Assistant. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="chat.js"></script>
</body>
</html>
